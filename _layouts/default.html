<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This makes the site render properly on phones, not just desktop -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: "Shreya Shah" }}</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=EB+Garamond:wght@400;600&display=swap');

  body {
    background-color: #0a0a0a;
    color: #ffffff;
    margin: 0;
    font-family: 'EB Garamond', Garamond, serif;
  }

  nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 500; /* lower than .curtain-overlay's 999, so curtains cover it */
    background-color: #000000;
    display: flex;
    justify-content: center;
    gap: 1rem;
    padding: 1rem 0;
  }

  nav a {
    color: #ffffff;
    text-decoration: none;
    font-family: 'EB Garamond', Garamond, serif;
    padding: 0.5rem 1.5rem;
    border: 1px solid #ffffff;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  nav a:hover {
    background-color: #b30000;
    color: #000000;
  }
  @media (max-width: 600px) {
    nav {
      flex-wrap: wrap;      /* let boxes drop to a second row instead of overflowing */
      gap: 0.5rem;
    }
  
    nav a {
      padding: 0.4rem 0.8rem;  /* smaller boxes need less padding to fit */
      font-size: 0.9rem;
    }
  }
    
  </style>
</head>
<body>
  <nav>
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/cv' | relative_url }}">CV</a>
    <a href="{{ '/projects' | relative_url }}">Projects</a>
    <a href="{{ '/blog' | relative_url }}">Blog</a>
  </nav>

  <main>
    {{ content }}
  </main>

</body>
</html>
